spring:
  application:
    name: tonefit-server
  profiles:
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          json_format_mapper: jackson
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

# ALB/외부 헬스체크용. 그 외 actuator endpoint는 노출 안 함.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

# 운영 안정성: 풀 수명 < RDS/네트워크 LB idle 한계
# (prod profile 에서 override 하지 않으면 이 값을 그대로 사용)
spring.datasource.hikari:
  maximum-pool-size: 10
  max-lifetime: 1700000
  idle-timeout: 600000
  keepalive-time: 300000

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# jwt.secret 디폴트는 의도적으로 박지 않는다. prod 에선 AwsSecretsManagerEnvironmentPostProcessor 가
# tonefit/app 의 JWT_SECRET 으로 채우고, 로컬·docker 프로파일은 자체 application-*.yml 에 둔다.
# 디폴트가 박혀 있으면 시크릿 주입 실패 시 fallback 으로 약한 키가 쓰이므로 차단.
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour

ai:
  provider: stub

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3-flash-preview
  base-url: https://generativelanguage.googleapis.com/v1beta

amplitude:
  enabled: ${AMPLITUDE_ENABLED:false}
  api-key: ${AMPLITUDE_API_KEY:}
  base-url: https://api2.amplitude.com
