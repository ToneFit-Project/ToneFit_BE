spring:
  application:
    name: tonefit-server
  profiles:
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          json_format_mapper: jackson
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

# ALB/외부 헬스체크용. 그 외 actuator endpoint는 노출 안 함.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

# 운영 안정성: 풀 수명 < RDS/네트워크 LB idle 한계
# (prod profile 에서 override 하지 않으면 이 값을 그대로 사용)
spring.datasource.hikari:
  maximum-pool-size: 10
  max-lifetime: 1700000
  idle-timeout: 600000
  keepalive-time: 300000

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# jwt.secret 디폴트는 의도적으로 박지 않는다. prod 에선 AwsSecretsManagerEnvironmentPostProcessor 가
# tonefit/app 의 JWT_SECRET 으로 채우고, 로컬·docker 프로파일은 자체 application-*.yml 에 둔다.
# 디폴트가 박혀 있으면 시크릿 주입 실패 시 fallback 으로 약한 키가 쓰이므로 차단.
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour

ai:
  provider: stub

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3-flash-preview
  base-url: https://generativelanguage.googleapis.com/v1beta

amplitude:
  enabled: ${AMPLITUDE_ENABLED:false}
  api-key: ${AMPLITUDE_API_KEY:}
  base-url: https://api2.amplitude.com

# Google OAuth — FE 가 받아온 ID token 의 audience 검증용 client-id whitelist.
# 운영에선 AwsSecretsManagerEnvironmentInitializer 가 GOOGLE_OAUTH_CLIENT_IDS 환경변수로 주입.
# (콤마 구분 문자열을 Spring 이 List<String> 으로 자동 바인딩)
google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}

# refresh_token 쿠키 Secure 속성. 운영=true / 로컬=false.
app:
  cookie:
    secure: ${COOKIE_SECURE:true}

# 사용자별(계정 단위) AI 호출 한도 (REQ-Limit). 정식 사용자만 적용, 익명/데모 제외.
# 값은 환경변수(운영은 AWS Secrets Manager)로 주입 — Extension 재배포 없이 조정.
# 현재 값은 임시 (FUNC-Lim-07 PM 확정 후 교체). correction/generation 각각 독립 카운트.
limit:
  user:
    daily: ${USER_LIMIT_DAILY:100}
    per-minute: ${USER_LIMIT_PER_MINUTE:10}

# IP 단위 요청 빈도 제한 (분당). client IP 당 /auth/google·/corrections·/generations 각각 적용.
# 환경변수로 조정 — 재배포 없이 QA·튜닝. intervally refill 이라 "1분 윈도우 내 N회 초과 차단".
ratelimit:
  ip:
    per-minute: ${IP_RATE_LIMIT_PER_MINUTE:10}
