spring:
  application:
    name: tonefit-server
  profiles:
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          json_format_mapper: jackson
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

# 외부 헬스체크(배포 스크립트·모니터링)용. 그 외 actuator endpoint는 노출 안 함.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

# 운영 안정성: 풀 수명 < RDS/네트워크 LB idle 한계
# (prod profile 에서 override 하지 않으면 이 값을 그대로 사용)
spring.datasource.hikari:
  maximum-pool-size: 10
  max-lifetime: 1700000
  idle-timeout: 600000
  keepalive-time: 300000

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# jwt.secret 디폴트는 의도적으로 박지 않는다. prod 에선 AwsSecretsManagerEnvironmentPostProcessor 가
# tonefit/app 의 JWT_SECRET 으로 채우고, 로컬·docker 프로파일은 자체 application-*.yml 에 둔다.
# 디폴트가 박혀 있으면 시크릿 주입 실패 시 fallback 으로 약한 키가 쓰이므로 차단.
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour
  # refresh token 수명(일) — chrome.identity silent 갱신 불가 판명(2026-07)으로 RTR 재도입 (V26).
  # 임시 14일(PM 협의값) — AWS(JWT_REFRESH_EXPIRATION_DAYS)로 재배포 없이 조정.
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  # RTR 재사용 유예(초, V28) — 소진 후 이 시간 내 재제시는 응답 유실 재시도로 보고 철회 대신 재회전.
  # 0 이면 유예 없음(모든 재사용 즉시 family 철회).
  refresh-reuse-grace-seconds: ${JWT_REFRESH_REUSE_GRACE_SECONDS:15}

ai:
  provider: stub
  # 폴오버(헤지 + 차단기) 활성 스위치. 기본 false → 현행(Gemini 단독) 동작. prod 에서 단계적 활성.
  # 임계값은 #59 지연 데이터로 확정 예정 — 우선 PM 협의 임시값(헤지 10s / 데드라인 30s / 1h 5건 → 30분).
  failover:
    enabled: ${AI_FAILOVER_ENABLED:false}
    hedge-delay-ms: ${AI_FAILOVER_HEDGE_DELAY_MS:10000}
    deadline-ms: ${AI_FAILOVER_DEADLINE_MS:30000}
    circuit:
      failure-threshold: ${AI_FAILOVER_CIRCUIT_FAILURES:5}
      window-ms: ${AI_FAILOVER_CIRCUIT_WINDOW_MS:3600000}
      open-ms: ${AI_FAILOVER_CIRCUIT_OPEN_MS:1800000}

# OpenAI(GPT) 폴오버 fallback. ai.failover.enabled=true 일 때만 사용.
# api-key 는 시크릿 → AWS Secrets Manager(OPENAI_API_KEY) 필수. 모델은 PM 확정값을
# 기본값으로 박음 — env/AWS Secret(OPENAI_*_MODEL)로 재배포 없이 변경 가능(선택).
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  generation-model: ${OPENAI_GENERATION_MODEL:gpt-4.1-mini}
  # 교정 폴오버: PM 테스트 결과 gpt-5.4-mini (프롬프트 유지, 생성 폴오버는 gpt-4.1-mini 그대로).
  correction-model: ${OPENAI_CORRECTION_MODEL:gpt-5.4-mini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  # 회신 작성(draft) 모델 — PM 확정: gemini-3.5-flash + thinkingLevel low.
  # 운영은 AWS Secrets Manager GEMINI_MODEL(필수 키)이 이 값을 덮음 — AWS 쪽도 함께 갱신 필요.
  model: gemini-3.5-flash
  # 회신 작성 전용 thinkingLevel (gemini-3 계열). 비우면 thinkingConfig 미지정. 보조 3종엔 미적용.
  reply-thinking-level: ${GEMINI_REPLY_THINKING_LEVEL:low}
  # 회신 요약·파악·점검 보조 단계용 저가 모델 (FUNC-Rep-15). 비우면 model 로 fallback.
  # 운영은 AWS Secrets Manager GEMINI_LITE_MODEL 로 지정됨 (현재 gemini-3.1-flash-lite).
  light-model: ${GEMINI_LITE_MODEL:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  # 생성: PM 실험 결과 비용 절감 위해 gemini-2.5-flash + thinkingBudget=512 (~53% 절감 기대).
  #   2.5 계열은 thinkingBudget 사용. 미설정 시 model 로 fallback.
  generation-model: ${GEMINI_GENERATION_MODEL:gemini-2.5-flash}
  generation-thinking-budget: ${GEMINI_GENERATION_THINKING_BUDGET:512}
  # 교정: PM 실험 결과 gemini-3.5-flash + thinkingLevel=low (~27% 절감·성능 향상 기대).
  #   gemini-3 계열은 thinkingLevel 사용. budget·level 동시 지정은 Gemini 가 거부하므로 level 만. 미설정 시 model fallback.
  correction-model: ${GEMINI_CORRECTION_MODEL:gemini-3.5-flash}
  correction-thinking-level: ${GEMINI_CORRECTION_THINKING_LEVEL:low}

amplitude:
  enabled: ${AMPLITUDE_ENABLED:false}
  api-key: ${AMPLITUDE_API_KEY:}
  base-url: https://api2.amplitude.com

# Google OAuth — FE 가 받아온 ID token 의 audience 검증용 client-id whitelist.
# 운영에선 AwsSecretsManagerEnvironmentInitializer 가 GOOGLE_OAUTH_CLIENT_IDS 환경변수로 주입.
# (콤마 구분 문자열을 Spring 이 List<String> 으로 자동 바인딩)
google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}

# refresh_token 쿠키 Secure 속성. 운영=true / 로컬=false.
app:
  cookie:
    secure: ${COOKIE_SECURE:true}
  security:
    # 응답 Content-Security-Policy. 기본값은 Swagger UI(로컬·도커) 렌더 호환을 위해
    # script/style 'unsafe-inline' 을 허용한 완화판. prod 는 Swagger 비활성이라
    # application-prod.yml 에서 strict(default-src 'none')로 override 한다.
    content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# 사용자별(계정 단위) AI 호출 한도 (REQ-Limit). 정식 사용자만 적용, 익명/데모 제외.
# 값은 환경변수(운영은 AWS Secrets Manager)로 주입 — 재배포 없이 조정(USER_LIMIT_*·USER_REPLY_LIMIT_PER_MINUTE).
# daily 는 교정·생성·회신 3기능 합산 (FUNC-Lim-08 PM 확정). 분당은 카테고리별 독립.
# 회신은 1건당 1회만 차감(파악 시점) — 요약/작성은 이 분당 버킷을 갉지 않음.
# reply-per-minute: PM 확정값 3. 아래는 FE 테스트 여유로 임시 상향 — 테스트 후 AWS USER_REPLY_LIMIT_PER_MINUTE=3 으로 복구.
limit:
  user:
    daily: ${USER_LIMIT_DAILY:100}
    per-minute: ${USER_LIMIT_PER_MINUTE:10}
    reply-per-minute: ${USER_REPLY_LIMIT_PER_MINUTE:20}

# IP 단위 요청 빈도 제한 (분당). client IP 당 /auth/google·/corrections·/generations 각각 적용.
# 환경변수로 조정 — 재배포 없이 QA·튜닝. intervally refill 이라 "1분 윈도우 내 N회 초과 차단".
ratelimit:
  ip:
    per-minute: ${IP_RATE_LIMIT_PER_MINUTE:10}

# 회신 설정.
# enabled: FUNC-Lim-10 수동 킬스위치 — 전체 비용이 위험선에 가까워지면 false 로 내려 회신만 차단
#   (생성·교정 유지). 위험선이 데이터 기반으로 정의될 때까지 수동 운영 (PM 확정).
# draft-budget-seconds: FUNC-Rep-12 — 60초 목표 중 ② 작성+점검 구간 예산 (① 파악은 Gemini 30초 타임아웃).
#   예산 내에서 작성→점검→(실패 시) 1회 재작성. 모자라면 재작성 없이 첫 초안 반환.
reply:
  enabled: ${REPLY_ENABLED:true}
  draft-budget-seconds: ${REPLY_DRAFT_BUDGET_SECONDS:40}
