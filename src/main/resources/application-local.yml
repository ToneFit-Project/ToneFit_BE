spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${DB_NAME:tonefitdb}
    username: ${DB_USERNAME:tonefit_user}
    password: ${DB_PASSWORD:tonefit1234}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed/local

ai:
  provider: ${AI_PROVIDER:stub}
gemini:
  api-key: ${GEMINI_API_KEY:}

# 로컬 개발 전용 디폴트 — 운영용 키 아님. 문서에도 박혀 있어 외부 노출돼도 무관한 길이용 더미.
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-prod-must-be-at-least-48-bytes-long}

# 로컬 dev 는 HTTP 라 Secure 쿠키 송신 불가 → false.
# Google OAuth client-id 는 dev 용 별도 발급 권장. 미설정 시 /auth/google 호출 시 audience 검증 실패.
app:
  cookie:
    secure: ${COOKIE_SECURE:false}
google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
